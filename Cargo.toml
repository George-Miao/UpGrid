[workspace]
members = ["crates/*"]
default-members = ["crates/upgrid"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.1", default-features = false, features = ["json", "query"] }
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
compio = { version = "0.19.1", features = ["macros", "runtime", "io", "net", "time", "enable_log"] }
compio-quic = "0.8.0"
compio-tls = { version = "0.10", default-features = false, features = ["ring"] }
criterion = "0.8"
cyper = { version = "0.9.0", default-features = false, features = ["rustls"] }
cyper-axum = { version = "0.9.0", features = ["http2"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
futures-channel = "0.3.31"
futures-core = "0.3.31"
futures-util = "0.3.31"
http = "1"
httpdate = "1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
openraft = { version = "0.10.0-alpha.34", default-features = false, features = ["serde", "single-threaded", "type-alias"] }
openraft-rt-compio = "0.10.0-alpha.34"
postcard = { version = "1.1.1", features = ["use-std"], default-features = false }
ping = { version = "0.9", default-features = false }
quick_cache = "0.6.16"
rcgen = "0.14.3"
redb = "4.1.0"
refinery = { version = "0.9.2", features = ["rusqlite"] }
rusqlite = { version = "0.38", features = ["blob"] }
ring = "0.17.14"
regex = "1.13.1"
rustls = { version = "0.23.31", default-features = false, features = ["ring"] }
rhai = { version = "1.25.1", features = ["sync"] }
sea-query = "1.0"
sea-query-rusqlite = "0.8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
serde_json_path = "0.7.2"
snafu = { version = "0.8.6", features = ["futures"] }
synchrony = { version = "0.1.9", features = ["event", "watch"] }
tap = "1.0.1"
tarpc = { version = "0.36.0", features = ["serde1"], git = "https://github.com/George-Miao/tarpc.git" }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = { version = "2.5.4", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "url"] }
utoipa-axum = "0.2"
webpki-roots = "1"
uuid = { version = "1.17.0", features = ["serde", "v7"] }

upgrid-api = { path = "crates/upgrid-api" }
upgrid-config = { path = "crates/upgrid-config" }
upgrid-notification = { path = "crates/upgrid-notification" }
upgrid-monitor = { path = "crates/upgrid-monitor" }
upgrid-raft = { path = "crates/upgrid-raft" }
upgrid-transport = { path = "crates/upgrid-transport" }
