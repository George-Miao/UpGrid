[workspace]
members = ["crates/*"]
default-members = ["crates/upgrid"]
exclude = ["vendor/cyper", "vendor/openraft-rt-compio"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-stream = "0.3.6"
axum = { version = "0.8.1", features = ["json"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
compio = { version = "0.19.1", features = ["macros", "runtime", "io", "net", "time", "enable_log"] }
compio-quic = "0.8.0"
cyper = { path = "vendor/cyper", version = "0.9.0", default-features = false, features = ["rustls"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
futures-core = "0.3.31"
httpdate = "1"
http = "1"
openraft = { version = "0.10.0", git = "https://github.com/George-Miao/openraft.git", features = ["serde", "singlethreaded", "type-alias"] }
openraft-rt-compio = { path = "vendor/openraft-rt-compio", version = "0.10.0" }
postcard = { version = "1.1.1", features = ["use-std"], default-features = false }
quick_cache = "0.6.16"
rcgen = "0.14.3"
redb = "4.1.0"
ring = "0.17.14"
rustls = { version = "0.23.31", default-features = false, features = ["ring"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1"
snafu = { version = "0.8.6", features = ["futures"] }
tap = "1.0.1"
tarpc = { version = "0.36.0", features = ["serde1"], git = "https://github.com/George-Miao/tarpc.git" }
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
url = { version = "2.5.4", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "url"] }
utoipa-axum = "0.2"
uuid = { version = "1.17.0", features = ["serde", "v7"] }

upgrid-api = { path = "crates/upgrid-api" }
upgrid-config = { path = "crates/upgrid-config" }
upgrid-notification = { path = "crates/upgrid-notification" }
upgrid-raft = { path = "crates/upgrid-raft" }
upgrid-transport = { path = "crates/upgrid-transport" }

[patch.crates-io]
compio = { git = "https://github.com/compio-rs/compio.git", branch = "master" }
compio-buf = { git = "https://github.com/compio-rs/compio.git", branch = "master" }
compio-driver = { git = "https://github.com/compio-rs/compio.git", branch = "master" }
compio-fs = { git = "https://github.com/compio-rs/compio.git", branch = "master" }
compio-io = { git = "https://github.com/compio-rs/compio.git", branch = "master" }
compio-log = { git = "https://github.com/compio-rs/compio.git", branch = "master" }
compio-macros = { git = "https://github.com/compio-rs/compio.git", branch = "master" }
compio-net = { git = "https://github.com/compio-rs/compio.git", branch = "master" }
compio-quic = { git = "https://github.com/compio-rs/compio.git", branch = "master" }
compio-runtime = { git = "https://github.com/compio-rs/compio.git", branch = "master" }
