<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UpGrid</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0d0c;--panel:#111614;--line:#26302c;--muted:#8b9c95;--text:#edf5f1;--green:#52e39a;--red:#ff6b6b;--amber:#f4c15d;--blue:#72a7ff}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#173128 0,transparent 33%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,sans-serif}
    button,input,select,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:36px 24px 80px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{display:flex;gap:13px;align-items:center}.mark{width:38px;height:38px;border:1px solid #387057;border-radius:12px;display:grid;place-items:center;background:#10261d;box-shadow:0 0 30px #38d88820}.mark:after{content:"";width:14px;height:14px;border:3px solid var(--green);border-radius:50%;box-shadow:0 0 12px #52e39a}.brand h1{font-size:20px;margin:0;letter-spacing:.02em}.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}.top-actions,.live{display:flex;gap:10px;align-items:center}.live{color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.metric,.panel{background:#111614dc;border:1px solid var(--line);border-radius:16px}.metric{padding:18px}.metric label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.metric strong{display:block;font-size:27px;margin-top:6px;font-weight:600}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}.panel{overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panel-head h2{font-size:14px;margin:0}.panel-body{padding:18px 20px}.target{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 20px;border-bottom:1px solid #1e2723}.target:last-child{border:0}.state{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px currentColor}.state.up{background:var(--green);color:var(--green)}.state.down{background:var(--red);color:var(--red)}.target h3{font-size:14px;margin:0 0 3px}.meta{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.latency{text-align:right}.latency strong{display:block;font-weight:500}.latency span{font-size:11px;color:var(--muted)}
    .button{border:1px solid #345444;background:#173326;color:#dff8eb;padding:8px 12px;border-radius:9px;cursor:pointer}.button:hover{border-color:#4c8a6b}.button.ghost{background:transparent;border-color:var(--line);color:var(--muted)}.button.danger{color:#ff9696}.empty{padding:46px 20px;text-align:center;color:var(--muted)}.form{display:grid;gap:12px}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--muted);letter-spacing:.04em}.field input,.field select,.field textarea{width:100%;background:#0c110f;border:1px solid var(--line);color:var(--text);padding:9px 10px;border-radius:9px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#43805f}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#6f8078;margin-top:10px}.channels{display:grid;gap:8px;margin-top:8px}.channel{border:1px solid var(--line);padding:10px;border-radius:10px}.channel strong{display:block;font-size:12px}.channel span{color:var(--muted);font-size:11px}.tabs{display:flex;gap:5px}.tab{border:0;background:transparent;color:var(--muted);padding:5px 8px;cursor:pointer}.tab.active{color:var(--text);background:#202925;border-radius:7px}.notice{margin-bottom:12px;padding:9px 11px;border:1px solid #7a302f;background:#3a1717;border-radius:9px;color:#ffb0ad;display:none}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:5px}dialog{width:min(620px,calc(100% - 32px));color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 24px 80px #000a}dialog::backdrop{background:#050706c9;backdrop-filter:blur(4px)}dialog h2{margin:0 0 5px;font-size:17px}dialog p{margin:0 0 16px;color:var(--muted)}.join-link{display:block;width:100%;resize:none;background:#0c110f;border:1px solid var(--line);border-radius:9px;color:var(--green);padding:11px;font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:850px){.summary{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.top{align-items:flex-start}.target{grid-template-columns:auto minmax(0,1fr)}.latency{grid-column:2;text-align:left}}@media(max-width:560px){.shell{padding:24px 14px}.summary{grid-template-columns:1fr 1fr}.metric{padding:14px}.metric strong{font-size:22px}.top-actions{align-items:flex-end;flex-direction:column-reverse}.live{padding-right:4px}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="brand"><div class="mark"></div><div><h1>UpGrid</h1><p>Distributed service monitoring</p></div></div><div class="top-actions"><button class="button ghost" onclick="createJoinLink()">Add node</button><div class="live"><i class="dot"></i><span id="connection">live</span></div></div></header>
  <section class="summary"><div class="metric"><label>Targets</label><strong id="total">0</strong></div><div class="metric"><label>Up</label><strong id="up">0</strong></div><div class="metric"><label>Down</label><strong id="down">0</strong></div><div class="metric"><label>Pending alerts</label><strong id="pending">0</strong></div></section>
  <div class="layout">
    <section class="panel"><div class="panel-head"><h2>Targets</h2><button class="button ghost" onclick="refresh()">Refresh</button></div><div id="targets"></div></section>
    <aside class="panel"><div class="panel-head"><h2>Configuration</h2><div class="tabs"><button id="target-tab" class="tab active" onclick="showTab('target')">Target</button><button id="channel-tab" class="tab" onclick="showTab('channel')">Channel</button></div></div><div class="panel-body"><div id="notice" class="notice"></div>
      <form id="target-form" class="form">
        <div class="field"><label>Name</label><input name="name" placeholder="Production API" required></div>
        <div class="field"><label>URL</label><input name="url" type="url" placeholder="https://example.com/health" required></div>
        <div class="row"><div class="field"><label>Method</label><input name="method" value="GET" required></div><div class="field"><label>Expected status</label><input name="statuses" value="200-299"></div></div>
        <div class="row"><div class="field"><label>Interval (seconds)</label><input name="interval" type="number" min="1" value="60"></div><div class="field"><label>Timeout (seconds)</label><input name="timeout" type="number" min="1" value="10"></div></div>
        <div class="field"><label>Failures before Down</label><input name="failures" type="number" min="1" value="3"></div>
        <div class="field"><label>Body must contain (optional)</label><input name="contains" placeholder="ok"></div>
        <div class="field"><label>Request body (optional)</label><textarea name="body" rows="2"></textarea></div>
        <div class="field"><label>Headers as JSON</label><textarea name="headers" rows="2" placeholder='{"Authorization":"Bearer …"}'>{}</textarea></div>
        <div class="field"><label>Notification channels</label><div id="channel-options" class="channels"><span class="meta">No channels configured</span></div></div>
        <button class="button" type="submit">Add target</button>
      </form>
      <form id="channel-form" class="form" hidden>
        <div class="field"><label>Type</label><select name="type" onchange="channelType()"><option value="webhook">Webhook</option><option value="telegram">Telegram</option></select></div>
        <div class="field"><label>Name</label><input name="name" placeholder="On-call" required></div>
        <div id="webhook-fields"><div class="field"><label>Webhook URL</label><input name="webhook_url" type="url" placeholder="https://hooks.example.com/upgrid"></div><div class="field"><label>Headers as JSON</label><textarea name="headers" rows="2">{}</textarea></div></div>
        <div id="telegram-fields" hidden><div class="field"><label>Bot token</label><input name="bot_token" autocomplete="off"></div><div class="field"><label>Chat ID</label><input name="chat_id"></div></div>
        <button class="button" type="submit">Add channel</button>
      </form>
    </div></aside>
  </div>
</main>
<dialog id="join-dialog"><h2>One command to join</h2><p>This link can admit one Node for 10 minutes and contains Cluster credentials. Keep it private even after expiry.</p><textarea id="join-command" class="join-link" rows="4" readonly></textarea><div class="dialog-actions"><button class="button ghost" onclick="document.querySelector('#join-dialog').close()">Close</button><button id="copy-join" class="button" onclick="copyJoinCommand()">Copy command</button></div></dialog>
<script>
  let channels=[];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function api(path,options){const response=await fetch(path,{headers:{'Content-Type':'application/json',...(options?.headers||{})},...options});if(!response.ok){let body;try{body=await response.json()}catch{body={error:await response.text()}}throw new Error(body.error||response.statusText)}return response.status===204?null:response.json()}
  function statusRanges(value){return value.split(',').map(part=>{const [start,end]=part.trim().split('-').map(Number);return {start,end:end||start}})}
  async function refresh(){try{const [targets,newChannels,alerts]=await Promise.all([api('/api/v1/targets'),api('/api/v1/channels'),api('/api/v1/alerts')]);channels=newChannels;document.querySelector('#total').textContent=targets.length;document.querySelector('#up').textContent=targets.filter(x=>x.availability==='up').length;document.querySelector('#down').textContent=targets.filter(x=>x.availability==='down').length;document.querySelector('#pending').textContent=alerts.filter(x=>x.delivery==='pending').length;document.querySelector('#targets').innerHTML=targets.length?targets.map(targetHtml).join(''):'<div class="empty">No targets yet. Add the first one to begin monitoring.</div>';document.querySelector('#channel-options').innerHTML=channels.length?channels.map(c=>`<label class="channel"><input type="checkbox" value="${c.id}"> <strong>${esc(c.name)}</strong><span>${esc(c.kind)} · ${esc(c.destination)}</span></label>`).join(''):'<span class="meta">No channels configured</span>';hideError()}catch(error){showError(error.message)}}
  function targetHtml(t){const latest=t.latest_evaluation;return `<article class="target"><i class="state ${esc(t.availability)}"></i><div><h3>${esc(t.name)}</h3><div class="meta">${esc(t.method)} · ${esc(t.url)} · every ${t.interval_seconds}s</div><div class="actions"><span class="meta">${esc(t.availability)}${t.consecutive_failures?' · '+t.consecutive_failures+' failed':''}</span><button class="tab danger" onclick="removeTarget('${t.id}')">Delete</button></div></div><div class="latency"><strong>${latest?latest.latency_ms+' ms':'—'}</strong><span>${latest?(latest.status_code||'network error'):'waiting'}</span></div></article>`}
  async function removeTarget(id){if(!confirm('Delete this target and its history?'))return;try{await api('/api/v1/targets/'+id,{method:'DELETE'});refresh()}catch(error){showError(error.message)}}
  async function createJoinLink(){try{const invite=await api('/api/v1/join-links',{method:'POST',body:JSON.stringify({expires_in_seconds:600})});document.querySelector('#join-command').value=`upgrid --join '${invite.url}'`;document.querySelector('#copy-join').textContent='Copy command';document.querySelector('#join-dialog').showModal()}catch(error){showError(error.message)}}
  async function copyJoinCommand(){const field=document.querySelector('#join-command');try{if(!navigator.clipboard)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(field.value)}catch{field.select();document.execCommand('copy');field.setSelectionRange(0,0)}document.querySelector('#copy-join').textContent='Copied'}
  document.querySelector('#target-form').addEventListener('submit',async event=>{event.preventDefault();const f=new FormData(event.target);try{const headers=JSON.parse(f.get('headers')||'{}');const selected=[...document.querySelectorAll('#channel-options input:checked')].map(x=>x.value);await api('/api/v1/targets',{method:'POST',body:JSON.stringify({name:f.get('name'),url:f.get('url'),method:f.get('method'),headers,body:f.get('body')||null,accepted_statuses:statusRanges(f.get('statuses')),follow_redirects:true,max_redirects:5,body_contains:f.get('contains')||null,skip_tls_verification:false,interval_seconds:Number(f.get('interval')),timeout_seconds:Number(f.get('timeout')),failure_threshold:Number(f.get('failures')),notification_channel_ids:selected})});event.target.reset();event.target.elements.statuses.value='200-299';event.target.elements.interval.value='60';event.target.elements.timeout.value='10';event.target.elements.failures.value='3';event.target.elements.headers.value='{}';refresh()}catch(error){showError(error.message)}});
  document.querySelector('#channel-form').addEventListener('submit',async event=>{event.preventDefault();const f=new FormData(event.target);try{let body=f.get('type')==='telegram'?{type:'telegram',name:f.get('name'),bot_token:f.get('bot_token'),chat_id:f.get('chat_id')}:{type:'webhook',name:f.get('name'),url:f.get('webhook_url'),headers:JSON.parse(f.get('headers')||'{}')};await api('/api/v1/channels',{method:'POST',body:JSON.stringify(body)});event.target.reset();event.target.elements.headers.value='{}';channelType();refresh()}catch(error){showError(error.message)}});
  function showTab(tab){document.querySelector('#target-form').hidden=tab!=='target';document.querySelector('#channel-form').hidden=tab!=='channel';document.querySelector('#target-tab').classList.toggle('active',tab==='target');document.querySelector('#channel-tab').classList.toggle('active',tab==='channel');hideError()}
  function channelType(){const telegram=document.querySelector('#channel-form [name=type]').value==='telegram';document.querySelector('#telegram-fields').hidden=!telegram;document.querySelector('#webhook-fields').hidden=telegram}
  function showError(message){const n=document.querySelector('#notice');n.textContent=message;n.style.display='block'}function hideError(){document.querySelector('#notice').style.display='none'}
  const source=new EventSource('/api/v1/events');source.addEventListener('state',()=>refresh());source.onopen=()=>{document.querySelector('#connection').textContent='live';document.querySelector('.dot').style.background='var(--green)'};source.onerror=()=>{document.querySelector('#connection').textContent='reconnecting';document.querySelector('.dot').style.background='var(--amber)'};
  refresh();
</script>
</body>
</html>
