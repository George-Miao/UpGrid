name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: git diff --exit-code -- frontend/dist
      - run: cargo fmt --all -- --check
      - run: scripts/check-rust-source-size.sh
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --no-run
      - run: cargo test published_openapi_matches_routes
      - run: scripts/test-api-tls.sh
      - run: pnpm --dir frontend exec playwright install --with-deps chromium
      - run: scripts/test-webui.sh
