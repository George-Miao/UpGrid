name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SQLite build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check source policies
        run: |
          scripts/check-rust-source-size.sh
          scripts/check-rust-error-types.sh

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Compile tests
        run: cargo test --workspace --no-run

      - name: Test generated OpenAPI
        run: cargo test -p upgrid-api published_openapi_matches_routes

      - name: Test API TLS
        run: scripts/test-api-tls.sh

  container:
    name: Container (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build container
        run: nix build .#container

      - name: Test container
        shell: bash
        run: |
          docker load --input result
          test "$(docker image inspect --format '{{.Config.User}}' upgrid:nix)" = "10001:10001"

          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_ARCH,,}"
          container="upgrid-ci-${suffix}"
          volume="upgrid-ci-${suffix}"
          tls_directory="$(mktemp -d)"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            rm -rf "$tls_directory"
          }
          trap cleanup EXIT

          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$tls_directory/key.pem" \
            -out "$tls_directory/cert.pem" >/dev/null 2>&1
          chmod 0644 "$tls_directory/key.pem" "$tls_directory/cert.pem"

          docker volume create "$volume"
          docker run \
            --detach \
            --name "$container" \
            --security-opt "seccomp=$GITHUB_WORKSPACE/upgrid-seccomp.json" \
            --env UPGRID_BIND=0.0.0.0:18443 \
            --env UPGRID_TLS_CERT=/run/upgrid-tls/cert.pem \
            --env UPGRID_TLS_KEY=/run/upgrid-tls/key.pem \
            --mount "type=bind,source=$tls_directory,target=/run/upgrid-tls,readonly" \
            --volume "$volume:/var/lib/upgrid" \
            upgrid:nix

          status=""
          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            if [[ "$status" == "healthy" ]]; then
              break
            fi
            if [[ "$status" == "unhealthy" ]] || [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]]; then
              docker logs "$container"
              exit 1
            fi
            sleep 1
          done
          if [[ "$status" != "healthy" ]]; then
            docker logs "$container"
            exit 1
          fi
          mount_name="$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/var/lib/upgrid"}}{{.Name}}{{end}}{{end}}' "$container")"
          test "$mount_name" = "$volume"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Check formatting
        run: pnpm --dir frontend format:check

      - name: Lint
        run: pnpm --dir frontend lint

      - name: Check types
        run: pnpm --dir frontend check

      - name: Build
        run: pnpm --dir frontend build

      - name: Check embedded assets
        run: git diff --exit-code -- frontend/dist

      - name: Install Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Test
        run: scripts/test-webui.sh

  website:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir website install --frozen-lockfile

      - name: Check formatting
        run: pnpm --dir website format:check

      - name: Lint
        run: pnpm --dir website lint

      - name: Check types
        run: pnpm --dir website check

      - name: Build
        run: pnpm --dir website build

      - name: Install Chromium
        run: pnpm --dir website exec playwright install --with-deps chromium

      - name: Test
        run: pnpm --dir website test
