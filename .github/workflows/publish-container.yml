name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "*"

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/george-miao/upgrid

permissions:
  contents: read

jobs:
  build-container:
    name: Build ${{ matrix.name }} container
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-24.04
            artifact: linux-amd64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Install Rust for release
        if: github.ref_type == 'tag'
        uses: dtolnay/rust-toolchain@nightly

      - name: Install SQLite build dependencies for release
        if: github.ref_type == 'tag'
        run: sudo apt-get update && sudo apt-get install --yes libsqlite3-dev pkg-config

      - name: Build release binary
        if: github.ref_type == 'tag'
        run: cargo build --locked --release -p upgrid

      - name: Build container binary
        run: nix build .#upgrid --out-link result-upgrid

      - name: Package release binary
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          archive="upgrid-${GITHUB_REF_NAME}-${{ matrix.artifact }}.tar.gz"
          tar --create --gzip --file "$archive" --directory target/release upgrid

      - name: Upload release binary
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: upgrid-${{ matrix.artifact }}
          path: upgrid-*.tar.gz
          if-no-files-found: error

      - name: Build container
        run: nix build .#container

      - name: Install Skopeo
        run: nix profile install nixpkgs#skopeo

      - name: Publish architecture image
        env:
          ARTIFACT: ${{ matrix.artifact }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          image="${IMAGE_NAME}:build-${GITHUB_SHA}-${ARTIFACT}"
          mkdir -p /tmp/digests
          skopeo copy \
            --dest-creds "${GHCR_USER}:${GHCR_TOKEN}" \
            --digestfile /tmp/digest \
            "docker-archive:result" \
            "docker://${image}"
          digest="$(cat /tmp/digest)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "could not read published image digest" >&2
            exit 1
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish container
    needs: build-container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tags
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            primary_tag="$GITHUB_REF_NAME"
            moving_tag="latest"
          else
            primary_tag="main-${GITHUB_SHA:0:6}"
            moving_tag="latest-unstable"
          fi
          for tag in "$primary_tag" "$moving_tag"; do
            if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "invalid container tag: $tag" >&2
              exit 1
            fi
          done
          echo "primary_tag=$primary_tag" >> "$GITHUB_OUTPUT"
          echo "moving_tag=$moving_tag" >> "$GITHUB_OUTPUT"

      - name: Create multi-architecture image
        env:
          PRIMARY_TAG: ${{ steps.image.outputs.primary_tag }}
          MOVING_TAG: ${{ steps.image.outputs.moving_tag }}
        shell: bash
        working-directory: /tmp/digests
        run: |
          images=()
          for digest in *; do
            images+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${PRIMARY_TAG}" \
            --tag "${IMAGE_NAME}:${MOVING_TAG}" \
            "${images[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${PRIMARY_TAG}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${MOVING_TAG}"

  build-release-binaries:
    name: Build ${{ matrix.name }} binary
    if: github.ref_type == 'tag'
    needs: build-container
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS AMD64
            runner: macos-15-intel
            artifact: macos-amd64
            target: x86_64-apple-darwin
          - name: macOS ARM64
            runner: macos-15
            artifact: macos-arm64
            target: aarch64-apple-darwin
          - name: Windows AMD64
            runner: windows-latest
            artifact: windows-amd64
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install SQLite for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install sqlite3:x64-windows
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Compile binary
        run: cargo build --locked --release -p upgrid --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="upgrid-${GITHUB_REF_NAME}-${{ matrix.artifact }}.tar.gz"
          mkdir output
          cp "target/${{ matrix.target }}/release/upgrid" output/upgrid
          tar --create --gzip --file "$archive" --directory output upgrid

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "upgrid-$env:GITHUB_REF_NAME-${{ matrix.artifact }}.zip"
          New-Item -ItemType Directory -Path output
          Copy-Item "target/${{ matrix.target }}/release/upgrid.exe" output/upgrid.exe
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/sqlite3.dll" output/sqlite3.dll
          Compress-Archive -Path output/* -DestinationPath $archive

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: upgrid-${{ matrix.artifact }}
          path: |
            upgrid-*.tar.gz
            upgrid-*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: build-release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: upgrid-*
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd release
          sha256sum upgrid-* > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          image_ref="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          image_url="https://github.com/${GITHUB_REPOSITORY}/pkgs/container/upgrid"
          printf -v image_note "## Container image\n\n[\`%s\`](%s)" "$image_ref" "$image_url"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber

            existing_notes="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
            if [[ "$existing_notes" != *"$image_ref"* ]]; then
              gh release edit "$GITHUB_REF_NAME" \
                --notes "$image_note"$'\n\n'"$existing_notes"
            fi
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --notes "$image_note" \
              --title "UpGrid $GITHUB_REF_NAME"
          fi
