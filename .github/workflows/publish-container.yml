name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "*"

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/george-miao/upgrid

permissions:
  contents: read

jobs:
  build-container:
    name: Build ${{ matrix.name }} container
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=container-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.artifact }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish container
    needs: build-container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="main-${GITHUB_SHA:0:6}"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid container tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create multi-architecture image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        working-directory: /tmp/digests
        run: |
          images=()
          for digest in *; do
            images+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${images[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"

  build-release-binaries:
    name: Build ${{ matrix.name }} binary
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          - name: Linux AMD64
            runner: ubuntu-24.04
            artifact: linux-amd64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract binary from image
        shell: bash
        run: |
          image="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker pull "$image"
          container_id="$(docker create "$image")"
          trap 'docker rm --force "$container_id"' EXIT
          mkdir output
          docker cp "$container_id:/usr/local/bin/upgrid" output/upgrid

      - name: Package binary
        shell: bash
        run: |
          archive="upgrid-${GITHUB_REF_NAME}-${{ matrix.artifact }}.tar.gz"
          tar --create --gzip --file "$archive" --directory output upgrid
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: upgrid-${{ matrix.artifact }}
          path: |
            upgrid-*.tar.gz
            upgrid-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: build-release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cat release/*.sha256 > release/SHA256SUMS
          rm release/*.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          image_ref="${IMAGE_NAME}:${GITHUB_REF_NAME}"
          image_url="https://github.com/${GITHUB_REPOSITORY}/pkgs/container/upgrid"
          printf -v image_note "## Container image\n\n[\`%s\`](%s)" "$image_ref" "$image_url"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber

            existing_notes="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
            if [[ "$existing_notes" != *"$image_ref"* ]]; then
              gh release edit "$GITHUB_REF_NAME" \
                --notes "$image_note"$'\n\n'"$existing_notes"
            fi
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --notes "$image_note" \
              --title "UpGrid $GITHUB_REF_NAME"
          fi
