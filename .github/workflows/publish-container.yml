name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "*"

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/george-miao/upgrid

permissions:
  contents: read

jobs:
  publish:
    name: Publish container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="main-${GITHUB_SHA:0:6}"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid container tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-release-binaries:
    name: Build ${{ matrix.name }} binary
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Linux AMD64
            platform: linux/amd64
            artifact: linux-amd64
          - name: Linux ARM64
            platform: linux/arm64
            artifact: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build binary
        uses: docker/build-push-action@v6
        with:
          context: .
          target: binary
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=output
          cache-from: type=gha

      - name: Package binary
        shell: bash
        run: |
          archive="upgrid-${GITHUB_REF_NAME}-${{ matrix.artifact }}.tar.gz"
          tar --create --gzip --file "$archive" --directory output upgrid
          sha256sum "$archive" > "$archive.sha256"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: upgrid-${{ matrix.artifact }}
          path: |
            upgrid-*.tar.gz
            upgrid-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: build-release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cat release/*.sha256 > release/SHA256SUMS
          rm release/*.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --title "UpGrid $GITHUB_REF_NAME"
          fi
